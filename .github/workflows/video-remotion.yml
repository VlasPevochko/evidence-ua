name: Evidence UA Video Factory

on:
  push:
    branches: ["feat/video-factory"]
  pull_request:
    branches: ["main"]
    paths:
      - "video/remotion/**"
      - ".github/workflows/video-remotion.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video/remotion
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and generate lockfile
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Remotion composition smoke check
        run: npm run compositions
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: remotion-package-lock
          path: video/remotion/package-lock.json
          if-no-files-found: error

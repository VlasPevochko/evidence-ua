name: Evidence UA Video Factory

on:
  pull_request:
    branches: ["main"]
    paths:
      - "video/remotion/**"
      - ".github/workflows/video-remotion.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video/remotion
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies and generate lockfile
        run: npm install
      - name: Commit generated lockfile
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(video): add Remotion lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Remotion composition smoke check
        run: npm run compositions
